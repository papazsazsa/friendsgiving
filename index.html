<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendsgiving Potluck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e8;--card:#fffaf3;--ink:#2b2118;--muted:#7a6a5a;--line:#e6d8c4;
  --accent:#b5521b;--accent-ink:#fff;--claimed:#eef3e6;--claimed-line:#c9d8b3;--warn:#fff1d6;--warn-line:#f0cf8a;--mine:#fbe3d3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1712;--card:#26201a;--ink:#f3e9dc;--muted:#b3a291;--line:#3a3128;
  --accent:#e0793d;--accent-ink:#1c1712;--claimed:#24301d;--claimed-line:#3d5230;--warn:#3a2f1a;--warn-line:#6b5428;--mine:#4a2c1a;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 80px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);margin:0 0 4px;letter-spacing:-.01em}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.35rem;margin:34px 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:8px;z-index:5}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:60px}
.me select{width:auto;min-width:160px}
button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 13px;font-weight:600;white-space:nowrap}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
.allergies{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.allergy{background:var(--warn);border:1px solid var(--warn-line);border-radius:12px;padding:12px}
.allergy b{display:block;margin-bottom:6px}
.allergy .txt{white-space:pre-wrap;min-height:1.5em}
.allergy .txt.empty{color:var(--muted);font-style:italic}
.allergy .edit{margin-top:8px;font-size:.85rem;padding:5px 10px}
.summary{display:grid;gap:8px}
.summary .row b{display:inline-block;min-width:96px}
.summary .none{color:var(--muted);font-style:italic}
.cat{margin-top:22px}
.cat h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.item{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.item.claimed{background:var(--claimed);border-color:var(--claimed-line)}
.item .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.item .name{font-weight:600}
.claims{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.claims li{font-size:.93rem}
.claims li.mine{background:var(--mine);border-radius:8px;padding:2px 8px;margin-left:-8px}
.claims .note{color:var(--muted)}
.claimbox{margin-top:10px;display:grid;gap:8px}
.addlink{display:inline-block;font-size:.9rem;margin:2px 0 4px}
.add{display:grid;grid-template-columns:2fr 1fr;gap:8px}
@media (max-width:560px){.add{grid-template-columns:1fr}}
.status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.status.show{opacity:1}
.err{background:#fde2e0;color:#7a1d14;border:1px solid #f1b3ab;border-radius:12px;padding:12px;margin-bottom:16px;display:none}
.small{font-size:.85rem;color:var(--muted)}
.hidden{display:none}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Friendsgiving Potluck</h1>
  <p class="sub">Choose your family, then tap what you're bringing. More than one family can bring the same dish.</p>
  <div class="err" id="err"></div>

  <div id="app" class="hidden">
    <div class="card me">
      <span>I am:</span>
      <select id="meSel"><option value="">Choose your family</option></select>
      <span class="small" id="mine"></span>
    </div>

    <h2>Allergies</h2>
    <div class="allergies" id="allergies"></div>

    <h2>Who's bringing what</h2>
    <div class="card summary" id="summary"></div>

    <h2>Food</h2>
    <div id="list"></div>

    <h2 id="add">Bringing something else?</h2>
    <div class="card">
      <div class="add">
        <input id="newName" placeholder="What are you bringing?">
        <select id="newCat"></select>
      </div>
      <textarea id="newNote" style="margin-top:8px" placeholder="Optional note (e.g., nut-free, my grandmother's recipe)"></textarea>
      <button id="addBtn" style="margin-top:8px">Add it</button>
    </div>
  </div>
</div>
<div class="status" id="status"></div>

<script>
const API = "https://textdb.dev/api/data/aa92b58f-e383-476e-b9cb-7fa83ba6500d";
const PARTIES = ["Mon/Joe","Hada/Kal","Kal/Luis","Julie/Papa"];
const OLD_NAMES = {"M&J":"Mon/Joe","H&K":"Hada/Kal","K&L":"Kal/Luis","J&C":"Julie/Papa"};
const CATS = ["Mains","Sides","Bread","Desserts","Drinks","Supplies"];
const SEED = [
  ["Turkey","Mains"],["Ham","Mains"],
  ["Mashed potatoes","Sides"],["Gravy","Sides"],["Stuffing","Sides"],["Green bean casserole","Sides"],
  ["Mac and cheese","Sides"],["Sweet potato casserole","Sides"],["Cranberry sauce","Sides"],["Salad","Sides"],["Roasted vegetables","Sides"],
  ["Dinner rolls","Bread"],["Cornbread","Bread"],
  ["Pumpkin pie","Desserts"],["Apple pie","Desserts"],["Pecan pie","Desserts"],["Whipped cream or ice cream","Desserts"],
  ["Wine or beer","Drinks"],["Juice boxes","Drinks"],["Sparkling water and soda","Drinks"],
  ["Plates, cups, napkins, utensils","Supplies"],["Ice","Supplies"]
];

const $ = id => document.getElementById(id);
let data = null, openClaim = null, busy = false;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function getMe(){try{const v=localStorage.getItem("fg_me")||"";return PARTIES.includes(v)?v:""}catch(e){return ""}}
function setMe(v){try{localStorage.setItem("fg_me",v)}catch(e){}}
function toast(msg){const s=$("status");s.textContent=msg;s.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>s.classList.remove("show"),1800)}
function showErr(msg){const e=$("err");e.textContent=msg;e.style.display=msg?"block":"none"}

function seedData(){
  const allergies={};PARTIES.forEach(p=>allergies[p]="");
  return {v:2,allergies,items:SEED.map(([name,cat])=>({id:uid(),name,cat,claims:[]}))};
}
// Bring older saved data up to the current format (party names and multiple families per dish).
function upgrade(d){
  if(!d) return null;
  if(d.v===2) return d;
  const fresh=seedData();
  for(const [k,v] of Object.entries(d.allergies||{})){const n=OLD_NAMES[k]||k; if(PARTIES.includes(n)&&v) fresh.allergies[n]=v;}
  const claimsByName={};
  (d.items||[]).forEach(i=>{ if(i.party){const p=OLD_NAMES[i.party]||i.party; (claimsByName[i.name]=claimsByName[i.name]||[]).push({party:p,note:i.note||""});} });
  fresh.items.forEach(i=>{ if(claimsByName[i.name]) i.claims=claimsByName[i.name]; });
  return fresh;
}

async function load(){
  const r=await fetch(API,{cache:"no-store"});
  if(!r.ok) throw new Error("load "+r.status);
  const t=(await r.text()).trim();
  return t?upgrade(JSON.parse(t)):null;
}
async function save(d){
  const r=await fetch(API,{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify(d)});
  if(!r.ok) throw new Error("save "+r.status);
}
// Re-read the latest copy right before every change, so two families saving at once don't overwrite each other.
async function mutate(fn,msg){
  if(busy) return; busy=true;
  try{
    const fresh=(await load())||seedData(); fn(fresh); await save(fresh); data=fresh; showErr(""); render(); if(msg) toast(msg);
  }catch(e){showErr("Couldn't save. Check your connection and try again.")}
  finally{busy=false}
}
async function refresh(){
  if(busy||openClaim||document.querySelector(".allergy textarea")||document.activeElement?.closest?.("#add,.claimbox")) return;
  try{const d=await load(); if(d){data=d;showErr("");render()}}catch(e){}
}

function render(){
  if(!data) return;
  const me=getMe(), items=data.items||[];
  // Allergies: only your own family's box is editable.
  $("allergies").innerHTML=PARTIES.map(p=>{
    const t=(data.allergies||{})[p]||"";
    return `<div class="allergy"><b>${esc(p)}</b>
      <div class="txt ${t?"":"empty"}">${t?esc(t):"No allergies listed yet"}</div>
      ${p===me?`<button class="ghost edit" data-edit-allergy="${esc(p)}">Edit</button>`:""}</div>`;
  }).join("");
  // Summary by family.
  $("summary").innerHTML=PARTIES.map(p=>{
    const mine=items.filter(i=>i.claims.some(c=>c.party===p)).map(i=>esc(i.name));
    return `<div class="row"><b>${esc(p)}</b> ${mine.length?mine.join(", "):`<span class="none">Nothing yet</span>`}</div>`;
  }).join("");
  // Dishes by category, each with a link to the "something else" form.
  $("list").innerHTML=CATS.map(cat=>{
    const rows=items.filter(i=>i.cat===cat);
    return `<div class="cat"><h3>${esc(cat)}</h3>${rows.map(i=>itemHtml(i,me)).join("")}
      <a href="#add" class="addlink" data-addcat="${esc(cat)}">+ Bringing something else? Add it</a></div>`;
  }).join("");
  const n=items.filter(i=>i.claims.some(c=>c.party===me)).length;
  $("mine").textContent=me?`You're bringing ${n} item${n===1?"":"s"}.`:"";
}

function itemHtml(i,me){
  const claimed=i.claims.length>0, isMine=i.claims.some(c=>c.party===me), open=openClaim===i.id;
  const list=claimed?`<ul class="claims">${i.claims.map(c=>`<li class="${c.party===me?"mine":""}"><b>${esc(c.party)}</b>${c.note?` <span class="note">– ${esc(c.note)}</span>`:""}</li>`).join("")}</ul>`:"";
  let action="";
  if(isMine) action=`<button class="ghost" data-release="${i.id}">Remove mine</button>`;
  else if(!open) action=`<button data-claim="${i.id}">${claimed?"We're bringing one too":"We'll bring it"}</button>`;
  const box=open?`<div class="claimbox"><textarea id="note_${i.id}" placeholder="Optional note (e.g., vegetarian version, nut-free, double batch)"></textarea>
    <div style="display:flex;gap:8px"><button data-confirm="${i.id}">Confirm</button><button class="ghost" data-cancel>Cancel</button></div></div>`:"";
  return `<div class="item ${claimed?"claimed":""}"><div class="top"><div class="name">${esc(i.name)}</div>${action}</div>${list}${box}</div>`;
}

function needMe(){ if(getMe()) return true; showErr("Choose your family at the top first."); $("meSel").focus(); window.scrollTo({top:0}); return false; }

document.addEventListener("click",e=>{
  const link=e.target.closest("[data-addcat]");
  if(link){ $("newCat").value=link.dataset.addcat; setTimeout(()=>{$("newName").focus({preventScroll:true}); $("newName").parentElement.parentElement.classList.remove("flash"); void $("newName").offsetWidth; $("newName").parentElement.parentElement.classList.add("flash");},350); return; }
  const t=e.target.closest("button");if(!t)return;
  const me=getMe();
  if(t.dataset.claim){ if(!needMe())return; showErr(""); openClaim=t.dataset.claim; render(); $("note_"+openClaim)?.focus(); }
  else if(t.dataset.cancel!==undefined){ openClaim=null; render(); }
  else if(t.dataset.confirm){
    const id=t.dataset.confirm, note=($("note_"+id)?.value||"").trim(); openClaim=null;
    mutate(d=>{const it=d.items.find(x=>x.id===id); if(it&&!it.claims.some(c=>c.party===me)) it.claims.push({party:me,note});},"Saved");
  }
  else if(t.dataset.release){
    const id=t.dataset.release;
    mutate(d=>{const it=d.items.find(x=>x.id===id); if(!it) return; it.claims=it.claims.filter(c=>c.party!==me);
      if(it.custom&&!it.claims.length) d.items=d.items.filter(x=>x.id!==id);},"Removed");
  }
  else if(t.dataset.editAllergy){
    const p=t.dataset.editAllergy; if(p!==me) return;
    const box=t.parentElement, cur=(data.allergies||{})[p]||"";
    box.innerHTML=`<b>${esc(p)}</b><textarea placeholder="e.g., peanuts, tree nuts, dairy">${esc(cur)}</textarea><div style="display:flex;gap:6px;margin-top:6px"><button data-save-allergy="${esc(p)}">Save</button><button class="ghost" data-cancel>Cancel</button></div>`;
    box.querySelector("textarea").focus();
  }
  else if(t.dataset.saveAllergy){
    const p=t.dataset.saveAllergy; if(p!==me) return;
    const v=t.parentElement.parentElement.querySelector("textarea").value.trim();
    mutate(d=>{d.allergies=d.allergies||{}; d.allergies[p]=v},"Allergies saved");
  }
});

$("addBtn").onclick=()=>{
  if(!needMe()) return;
  const me=getMe(), name=$("newName").value.trim(), cat=$("newCat").value, note=$("newNote").value.trim();
  if(!name){$("newName").focus();return}
  $("newName").value=""; $("newNote").value="";
  mutate(d=>{d.items.push({id:uid(),name,cat,custom:true,claims:[{party:me,note}]})},"Added");
};
$("meSel").onchange=e=>{setMe(e.target.value);showErr("");openClaim=null;render()};

async function start(){
  PARTIES.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;$("meSel").appendChild(o)});
  CATS.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("newCat").appendChild(o)});
  $("meSel").value=getMe();
  $("app").classList.remove("hidden");
  try{
    const r=await fetch(API,{cache:"no-store"}); const t=(await r.text()).trim(); const raw=t?JSON.parse(t):null;
    data=upgrade(raw)||seedData();
    if(!raw||raw.v!==2) await save(data);
    render();
  }catch(e){showErr("Couldn't load the list. Refresh the page to try again.")}
  // Pick up other families' changes when someone comes back to the page, and every 30 seconds while it's open.
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) refresh()});
  setInterval(()=>{if(!document.hidden) refresh()},30000);
}
start();
</script>
</body>
</html>
